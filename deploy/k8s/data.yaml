# Single-node stateful dependencies for a demo cluster. A real deployment would use managed Kafka/Postgres/ClickHouse or operators.
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: clearline }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: clearline }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: clearline }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: clearline }
            - { name: POSTGRES_USER, value: clearline }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: clearline-secrets, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
          readinessProbe: { exec: { command: ["pg_isready", "-U", "clearline", "-d", "clearline"] }, periodSeconds: 5 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: clearline }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: clearline }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      enableServiceLinks: false      # otherwise the "kafka" Service injects KAFKA_PORT and breaks the broker's own configuration
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
          ports: [{ containerPort: 9092 }]
          resources: { requests: { cpu: 200m, memory: 640Mi }, limits: { memory: 1Gi } }
          readinessProbe: { tcpSocket: { port: 9092 }, periodSeconds: 5, initialDelaySeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: clearline }
spec: { selector: { app: kafka }, ports: [{ port: 9092 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: clickhouse, namespace: clearline }
spec:
  serviceName: clickhouse
  replicas: 1
  selector: { matchLabels: { app: clickhouse } }
  template:
    metadata: { labels: { app: clickhouse } }
    spec:
      enableServiceLinks: false
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          env:
            - { name: CLICKHOUSE_DB, value: clearline }
            - { name: CLICKHOUSE_USER, value: clearline }
            - { name: CLICKHOUSE_PASSWORD, valueFrom: { secretKeyRef: { name: clearline-secrets, key: CLICKHOUSE_PASSWORD } } }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          ports: [{ containerPort: 8123 }]
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
            - { name: data, mountPath: /var/lib/clickhouse }
          resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { memory: 2Gi } }
          readinessProbe: { httpGet: { path: /ping, port: 8123 }, periodSeconds: 5 }
      volumes:
        - name: init
          configMap: { name: clickhouse-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 4Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: clickhouse, namespace: clearline }
spec: { selector: { app: clickhouse }, ports: [{ port: 8123 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: clearline }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      enableServiceLinks: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }]
          ports: [{ containerPort: 16686 }, { containerPort: 4318 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: clearline }
spec: { selector: { app: jaeger }, ports: [{ name: ui, port: 16686 }, { name: otlp, port: 4318 }] }
