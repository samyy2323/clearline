apiVersion: v1
kind: Namespace
metadata: { name: clearline }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: clearline-config, namespace: clearline }
data:
  SPRING_PROFILES_ACTIVE: full
  REDIS_URI: redis://redis:6379
  KAFKA_BOOTSTRAP: kafka:9092
  DB_URL: jdbc:postgresql://postgres:5432/clearline
  DB_USER: clearline
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clearline
  REPORTING_URL: http://reporting:8081
  OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
  TRACING_ENABLED: "true"
  EVENTS_LOG: ""
  AUTOSTART_SIM_RATE: "300"
  JAVA_OPTS: "-Xms256m -Xmx640m -XX:+UseG1GC"
---
# Dev defaults so a plain apply works out of the box. Replace with real secrets (sealed-secrets / external-secrets) for anything real.
apiVersion: v1
kind: Secret
metadata: { name: clearline-secrets, namespace: clearline }
type: Opaque
stringData:
  DB_PASSWORD: clearline-dev
  CLICKHOUSE_PASSWORD: clearline-dev
  JWT_SECRET: dev-only-jwt-secret-change-me-dev-only-jwt-secret
  HMAC_SECRET: dev-only-hmac-secret-change-me
  ADMIN_PASSWORD: admin123
  ADVERTISER_PASSWORD: advertiser123
  POSTGRES_PASSWORD: clearline-dev
