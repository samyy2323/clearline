apiVersion: apps/v1
kind: Deployment
metadata: { name: app, namespace: clearline, labels: { app: app } }
spec:
  replicas: 2
  selector: { matchLabels: { app: app } }
  template:
    metadata:
      labels: { app: app }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8080" }
    spec:
      terminationGracePeriodSeconds: 30     # graceful shutdown returns unused budget leases
      containers:
        - name: app
          image: clearline/app:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: clearline-config } }, { secretRef: { name: clearline-secrets } }]
          resources: { requests: { cpu: 250m, memory: 768Mi }, limits: { cpu: "2", memory: 1Gi } }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 3, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: app, namespace: clearline }
spec:
  selector: { app: app }
  ports: [{ port: 80, targetPort: 8080 }]
---
# Autoscaling demo: run the `spike` scenario and watch replicas follow CPU. Each new replica takes its own budget leases, so overspend
# slack grows with replica count (lease_size x instances): the trade-off documented in ADR 0001.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: app, namespace: clearline }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: app }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Pods, value: 2, periodSeconds: 30 }] }
    scaleDown: { stabilizationWindowSeconds: 120 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: reporting, namespace: clearline, labels: { app: reporting } }
spec:
  replicas: 1
  selector: { matchLabels: { app: reporting } }
  template:
    metadata: { labels: { app: reporting } }
    spec:
      containers:
        - name: reporting
          image: clearline/reporting:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          env: [{ name: PORT, value: "8081" }]
          envFrom: [{ configMapRef: { name: clearline-config } }, { secretRef: { name: clearline-secrets } }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8081 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: reporting, namespace: clearline }
spec:
  selector: { app: reporting }
  ports: [{ port: 8081, targetPort: 8081 }]
