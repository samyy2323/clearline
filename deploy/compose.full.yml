# Full edition: app (full profile) + reporting service + Kafka (KRaft) + Postgres + ClickHouse + Redis + Jaeger + Prometheus + Grafana.
# Needs roughly 4 CPU cores and 6-8 GB RAM. For a laptop-sized run use compose.lite.yml.
name: clearline-full
services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"]   # dev only: lets an IDE/host process reach the broker
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        T=/opt/kafka/bin/kafka-topics.sh; B=kafka:9092
        $$T --bootstrap-server $$B --create --if-not-exists --topic ad-events --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic ad-events.dlq --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic campaign-events --partitions 1 --replication-factor 1 --config cleanup.policy=compact
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clearline
      POSTGRES_USER: clearline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearline-dev}
    ports: ["127.0.0.1:${PG_HOST_PORT:-55432}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U clearline -d clearline"], interval: 5s, timeout: 3s, retries: 20 }

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      CLICKHOUSE_DB: clearline
      CLICKHOUSE_USER: clearline
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clearline-dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:${CH_HOST_PORT:-58123}:8123"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["${JAEGER_PORT:-16686}:16686"]

  app:
    build: { context: .., dockerfile: Dockerfile }
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: full
      PORT: 8080
      JAVA_OPTS: "-Xms256m -Xmx768m"
      REDIS_URI: redis://redis:6379
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/clearline
      DB_USER: clearline
      DB_PASSWORD: ${POSTGRES_PASSWORD:-clearline-dev}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clearline
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clearline-dev}
      REPORTING_URL: http://reporting:8081
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_ENABLED: "true"
      TRACING_SAMPLE: ${TRACING_SAMPLE:-1.0}
      AUTOSTART_SIM_RATE: ${AUTOSTART_SIM_RATE:-300}
      EVENTS_LOG: ""
      JWT_SECRET: ${JWT_SECRET:-}
      HMAC_SECRET: ${HMAC_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADVERTISER_PASSWORD: ${ADVERTISER_PASSWORD:-}
    ports: ["${APP_PORT:-8080}:8080"]

  reporting:
    build: { context: .., dockerfile: Dockerfile.reporting }
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      PORT: 8081
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clearline
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clearline-dev}
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_ENABLED: "true"
      TRACING_SAMPLE: ${TRACING_SAMPLE:-1.0}
      JWT_SECRET: ${JWT_SECRET:-}
    ports: ["${REPORTING_PORT:-8081}:8081"]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes: ["./prometheus.full.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["${PROM_PORT:-9090}:9090"]
    depends_on: [app]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
