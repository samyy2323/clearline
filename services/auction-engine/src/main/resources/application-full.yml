# Full edition: Postgres (Flyway) + Kafka + ClickHouse. Activated with SPRING_PROFILES_ACTIVE=full.
spring:
  autoconfigure:
    exclude: []
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clearline}
    username: ${DB_USER:clearline}
    password: ${DB_PASSWORD:clearline-dev}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
    locations: classpath:db/migration

exchange:
  mode: full
