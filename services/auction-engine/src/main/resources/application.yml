server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 400
    max-keep-alive-requests: -1
    keep-alive-timeout: 60s
    accept-count: 2000
  compression:
    enabled: true

spring:
  application:
    name: adexchange
  autoconfigure:
    # lite mode has no database: the full profile (application-full.yml) turns these back on
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}   # hot-path concurrency model flag, benchmarked in docs/optimization.md
  task:
    scheduling:
      pool:
        size: 4   # lease tick, pacing, stats sampler and relay must not starve each other when one blocks
  jackson:
    default-property-inclusion: non_null

management:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE:0.05}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: adexchange

exchange:
  mode: ${EXCHANGE_MODE:lite}                # lite | full (full = Postgres outbox, Kafka, ClickHouse)
  kafka-bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
  clickhouse-url: ${CLICKHOUSE_URL:http://localhost:8123}
  clickhouse-user: ${CLICKHOUSE_USER:clearline}
  clickhouse-password: ${CLICKHOUSE_PASSWORD:clearline-dev}
  reporting-url: ${REPORTING_URL:http://localhost:8081}
  reconcile-lag-ms: ${RECONCILE_LAG_MS:1800000}   # = tracking-token TTL: only bookings older than this can be judged "never billed"
  pricing: ${PRICING:ab}                    # first | gsp | ab
  lease-chunk-micros: ${LEASE_CHUNK_MICROS:5000000}
  lease-ttl-ms: ${LEASE_TTL_MS:60000}
  redis-uri: ${REDIS_URI:}                  # blank => in-memory (lite mode)
  hmac-secret: ${HMAC_SECRET:}
  jwt-secret: ${JWT_SECRET:}
  admin-password: ${ADMIN_PASSWORD:}
  advertiser-password: ${ADVERTISER_PASSWORD:}
  max-in-flight: ${MAX_IN_FLIGHT:4000}
  ip-rate-limit-per-sec: ${IP_RATE_LIMIT:0}
  model-path: ${MODEL_PATH:ml/out/weights.json}
  events-log: ${EVENTS_LOG:data/events.jsonl}
  seed-demo: ${SEED_DEMO:true}
  seed-budget-scale: ${SEED_BUDGET_SCALE:1}
  autostart-sim-rate: ${AUTOSTART_SIM_RATE:0}
  pacing-enabled: ${PACING_ENABLED:true}
